# Giao diện "giấy tờ hành chính": nền giấy trắng, mực xanh chữ ký, dấu đỏ cho trích dẫn.
[theme]
base = "light"
primaryColor = "#1F3A93"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F4F7"
textColor = "#1C2536"
redColor = "#B3261E"
linkColor = "#1F3A93"
borderColor = "#DCE0E8"
font = "'Be Vietnam Pro':https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap, sans-serif"
headingFontWeights = [700, 600, 600, 600]
baseRadius = "0.5rem"
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#F2F4F7"
secondaryBackgroundColor = "#FFFFFF"

[client]
toolbarMode = "minimal"
